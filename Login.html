<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión - Reino Mágico</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="luna"></div>
    <div class="estrellas" id="estrellas"></div>

    <div class="tarjeta">
        <div class="ornamento">✦ ❖ ✦</div>
        <h1 class="titulo">Reino Mágico</h1>
        <p class="subtitulo">Portal de entrada — inicia sesión para continuar tu aventura</p>

        <form id="form-login">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" placeholder="Tu nombre de usuario" autocomplete="username" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Tu contraseña" autocomplete="current-password" required>

            <p class="mensaje" id="mensaje"></p>
            <button type="submit" class="boton">Entrar ✦</button>
        </form>

        <p class="pie">¿Aún no tienes cuenta? <a href="Registro.html">Crea una cuenta</a></p>
    </div>

    <script src="magia.js"></script>
    <script>
        if (sesionActiva()) {
            window.location.href = 'menu.html';
        } else {
            var formLogin = document.getElementById('form-login');
            var mensaje = document.getElementById('mensaje');

            formLogin.addEventListener('submit', function (e) {
                e.preventDefault();
                mensaje.classList.remove('mensaje-exito');
                var usuario = document.getElementById('usuario').value.trim();
                var password = document.getElementById('password').value;
                var usuarios = leerUsuarios();

                if (!usuarios[usuario]) {
                    mensaje.textContent = 'Ese usuario no existe. Crea una cuenta primero.';
                } else if (usuarios[usuario] !== password) {
                    mensaje.textContent = 'Contraseña incorrecta. Inténtalo de nuevo.';
                } else {
                    iniciarSesion(usuario);
                    window.location.href = 'menu.html';
                }
            });
        }
    </script>
</body>
</html>
