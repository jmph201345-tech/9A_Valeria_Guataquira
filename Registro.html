<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro - Reino Mágico</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="luna"></div>
    <div class="estrellas" id="estrellas"></div>

    <div class="tarjeta">
        <div class="ornamento">✦ ❖ ✦</div>
        <h1 class="titulo">Crear Cuenta</h1>
        <p class="subtitulo">Regístrate para entrar al Reino Mágico</p>

        <form id="form-registro">
            <label for="nombre">Usuario</label>
            <input type="text" id="nombre" placeholder="Elige un nombre de usuario" autocomplete="username" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Mínimo 4 caracteres" autocomplete="new-password" required>

            <label for="password2">Confirmar contraseña</label>
            <input type="password" id="password2" placeholder="Repite tu contraseña" autocomplete="new-password" required>

            <p class="mensaje" id="mensaje"></p>
            <button type="submit" class="boton">Registrarme ✦</button>
        </form>

        <p class="pie">¿Ya tienes cuenta? <a href="Login.html">Inicia sesión</a></p>
    </div>

    <script src="magia.js"></script>
    <script>
        var formRegistro = document.getElementById('form-registro');
        var mensaje = document.getElementById('mensaje');

        formRegistro.addEventListener('submit', function (e) {
            e.preventDefault();
            mensaje.classList.remove('mensaje-exito');
            var usuario = document.getElementById('nombre').value.trim();
            var password = document.getElementById('password').value;
            var confirmacion = document.getElementById('password2').value;
            var usuarios = leerUsuarios();

            if (!usuario || !password || !confirmacion) {
                mensaje.textContent = 'Debes llenar todos los campos.';
            } else if (password.length < 4) {
                mensaje.textContent = 'La contraseña debe tener al menos 4 caracteres.';
            } else if (password !== confirmacion) {
                mensaje.textContent = 'Las contraseñas no coinciden.';
            } else if (usuarios[usuario]) {
                mensaje.textContent = 'Ese usuario ya existe. Elige otro nombre.';
            } else {
                usuarios[usuario] = password;
                guardarUsuarios(usuarios);
                iniciarSesion(usuario);
                window.location.href = 'menu.html';
            }
        });
    </script>
</body>
</html>
